name: tests

# The reference engine's test suite is the project's only automated check that
# the Mizo spec still behaves as written. Until now it only ran when someone
# remembered to run pytest locally, which undermines the drift detection the
# conformance vectors were added for -- so run it on every PR.

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only needs the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # packages/python declares requires-python = ">=3.9", so the tests run on
    # every version it claims to support rather than only the newest one.
    # CI follows the versions we support; it does not decide them.
    #
    # It matters more than it looks for the compiled artifact. compile_spec.py
    # emits conditions with ast.unparse, whose exact output is not guaranteed
    # to be identical across Python versions, and _mizo.py is generated on
    # whichever version the author happens to run. The matrix is what proves
    # the checked-in file is reproducible everywhere, not just on one machine.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r reference/requirements.txt

      # pytest runs from inside reference/ -- test_engine.py imports engine.py
      # as a top-level module. Same convention as reference/README.md.
      - name: Run tests
        working-directory: reference
        run: pytest

      # vectors/mizo.json is a checked-in snapshot, not computed at test time.
      # If this step fails, mizo.yaml changed without a regenerate: run
      # `python generate_vectors.py` from reference/ and commit the result.
      - name: Check vectors are up to date
        working-directory: reference
        run: |
          python generate_vectors.py
          git diff --exit-code ../vectors/mizo.json

      # Same idea for the compiled target-package artifact. The drift test in
      # pytest compares the text the compiler produces; this checks what it
      # actually writes to disk, so an encoding or newline bug in the writing
      # path cannot slip through. If this step fails, mizo.yaml changed
      # without a recompile: run `python compile_spec.py` from reference/ and
      # commit the result.
      - name: Check the compiled artifact is up to date
        working-directory: reference
        run: |
          python compile_spec.py
          git diff --exit-code ../packages/python/src/numberwords/_mizo.py
