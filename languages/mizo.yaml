# Mizo (Lushai) number spec.
#
# This is the primary target language. Numeral data (lexicon, grammar, and
# the compound-tens shorthand) has been verified by a native Mizo speaker --
# see meta.sources. The one deliberate exception is the "leh" connector
# (see parse.connectors below): it is genuinely ambiguous between an
# intra-number filler and the inter-number conjunction "and", and resolving
# that is out of scope for this rule engine by team decision -- it would
# take more than a rule engine to disambiguate, and the expectation is that
# callers (e.g. a post-ASR pipeline deciding phrase boundaries) hand this
# library unambiguous single-number phrases in the first place.
#
# Units have two grammatical forms depending on context: a standalone form
# (used alone, e.g. counting) and a bound form (used when combined with a
# scale word, e.g. after "sawm"). Grammar rules below select the correct
# form by what the digit does -- see the comment above `grammar:`.
#
# The words for 10 and 100 also have two forms, for a different reason. The
# circumflex on them is part of the grammar, not just decoration. It shows
# the scale word is *not multiplied*. If a digit comes after it, the
# circumflex stays (11 = 10+1 -> "sâwm pakhat"). If a digit multiplies it,
# the circumflex is removed (20 = 10×2 -> "sawm hnih", 200 = 100×2 -> "za
# hnih"). This is why we use `standalone` and `multiplied` below. The
# condition is different from units' `bound`: it depends on whether a
# multiplying digit comes before the scale word, not whether it follows one.
# From 10^3 up the circumflex stays either way ("sâng hnih", 2,000 -- #27
# rule 2), so those words have one form, written twice.

meta:
  language: Mizo
  code: lus           # ISO 639-3 for Lushai/Mizo.
  version: 0.7.0      # 0.7.0: supports.max raised to 10^10 - 1, with the
                      # seven scale words 10^3-10^9 and one rule each (#27).
                      # 0.6.0: rules keyed by scale, with {remainder} and
                      # [...] segments; grammar.connector replaces the
                      # literal "leh" in ten templates; parse_aliases
                      # becomes an `emit: never` rule; connector_precedes
                      # is gone, derived from the grammar instead (#65).
                      # 0.5.0: supports.max raised to 999, hundreds_digit
                      # added, and the six 200-999 rules (#27 step 2b).
                      # 0.4.0: word_separators declares only the
                      # non-whitespace separators; whitespace belongs to
                      # the engine (#46).
                      # 0.3.0: supports.max raised to 199, and parse gained
                      # connector_precedes (#19).
                      # 0.2.0: accepted_forms now names the table and fields
                      # it applies to, instead of Mizo-specific flags (#31).
  supports: { min: 0, max: 9999999999 }   # 10^10 - 1 (#27). The ladder's
                                   # top lexeme is 10^9 (#27 rule 4), but rule
                                   # 5 lets that scale take a multi-digit
                                   # multiplier (10^12 = "tlûklehdingâwn
                                   # sâng khat"), so the ceiling is a project
                                   # decision, not a linguistic one.
                                   # Decision (#27, 2026-09-25): 10^10 - 1.
                                   # Above it greedy binding reads a trailing
                                   # addend into the 10^9 multiplier, and no
                                   # spelling round-trips. Below it every
                                   # multiplier is a single digit, which is
                                   # what the rules above scale 100 rely on.
  orthography: missionary   # The writing system used by this spec. The
                            # diacritics depend on it, so a different writing
                            # system would change them throughout the lexicon.
  sources:
    - "Verified by Rosie Malsawmtluangi, native Mizo speaker."
    - "Diacritics and missionary orthography confirmed by the repo owner,
       a native Mizo speaker (#15). The earlier review checked the words
       without diacritics; this review confirms the spelling."
    - "The 101-199 forms, and where 'leh' may sit, confirmed by Rosie
       Malsawmtluangi and the repo owner, both native Mizo speakers (#19)."
    - "The 200-999 forms confirmed by Rosie Malsawmtluangi, native Mizo
       speaker, on #27 (Q-N, 2026-09-02), with the derivation recorded there:
       each mirrors its own 100-199 case, the hundreds digit multiplying za
       exactly as the tens digit multiplies sawm. The x1 and x2 behaviour of
       the scale words is the repo owner's, in #27's ladder table."
    - "The scale words for 10^3-10^9, their forms when multiplied, and the
       rules that combine them are the repo owner's, a native Mizo speaker, on
       #27: the ladder and rules 1-4 (2026-08-08), invariance when multiplied
       for 10^7-10^9 (Q-C, 2026-08-16), where 'leh' goes (Q-D, Q-M), and the
       worked examples below."

lexicon:
  units:               # 0–9. standalone = used alone; bound = used after a scale word (e.g. "sawm").
    0: { standalone: "bial",    bound: "bial"  }
    1: { standalone: "pakhat",  bound: "khat"  }
    2: { standalone: "pahnih",  bound: "hnih"  }
    3: { standalone: "pathum",  bound: "thum"  }
    4: { standalone: "pali",    bound: "li"    }
    5: { standalone: "panga",   bound: "nga"   }
    6: { standalone: "paruk",   bound: "ruk"   }
    7: { standalone: "pasarih", bound: "sarih" }
    8: { standalone: "pariat",  bound: "riat"  }
    9: { standalone: "pakua",   bound: "kua"   }
  scales:               # 10, 100, … -- each atomic, not composed.
                        # standalone = not multiplied (keeps the circumflex);
                        # multiplied = has a multiplying digit before it.
    10:  { standalone: "sâwm", multiplied: "sawm" }
    100: { standalone: "zâ",   multiplied: "za"   }
    # From 10^3 up the circumflex stays when the word is multiplied ("sâng
    # hnih", 2,000), so both forms are the same word, repeated like 0 in the
    # units table (#27 rule 2, Q-C). The x1 is always said from 10^3 up
    # ("sâng khat", #27 rule 1), so the rules below only ever write
    # `multiplied`.
    1000:       { standalone: "sâng",           multiplied: "sâng"           }
    10000:      { standalone: "sîng",           multiplied: "sîng"           }
    100000:     { standalone: "nuai",           multiplied: "nuai"           }
    1000000:    { standalone: "maktaduai",      multiplied: "maktaduai"      }
    10000000:   { standalone: "vaibêlchhe",     multiplied: "vaibêlchhe"     }
    100000000:  { standalone: "vaibêlchhetak",  multiplied: "vaibêlchhetak"  }
    1000000000: { standalone: "tlûklehdingâwn", multiplied: "tlûklehdingâwn" }
    # Nothing above 10^9: Mizo has no larger scale word (#27 rule 4).

# Rules are keyed by the scale they consume (#65), and each one sees two
# variables derived from the number being rendered and that scale:
#   multiplier = n // scale
#   remainder  = n %  scale
#
# Lexicon addressing is always <table>[<key>].<field>, e.g.:
#   units[multiplier].bound       -> bound form of the digit multiplying the scale
#   units[multiplier].standalone  -> standalone form of a lone digit
#   scales[10].standalone         -> the unmultiplied word for 10 ("sâwm")
#   scales[10].multiplied         -> the multiplied word for 10 ("sawm")
#
# `{remainder}` is the remainder rendered by these same rules, and `[...]` is
# dropped when the remainder is zero. So a rule covers every number its
# multiplier and condition allow at its scale: 20-99 is one rule, not a range
# per shape.

grammar:
  # Decision (#19, from Q-M on #27): "leh" is emitted before the final addend
  # and nowhere else, for every n >= 100. The final addend is the innermost
  # remainder: 108 is "zâ leh pariat", 128 is "zâ sawm hnih leh pariat", 130
  # is "zâ leh sawm thum". It is a property of the whole number rather than of
  # any one rule, so it is declared once instead of written into ten of the
  # seventeen templates this file used to carry.
  #
  # Below 100 none is emitted, and that asymmetry is a choice about canonical
  # output rather than a claim about the language: "sâwm leh pakhat" (11) is
  # as idiomatic as "sâwm pakhat" and is accepted, but number_to_text has to
  # pick one spelling per number and Q-M sets the threshold at 100. Where the
  # two are equivalent is the parse side -- see parse.connectors below.
  #
  # Where else "leh" may idiomatically stand -- before any top-level addend,
  # never before a digit bound to the scale word it multiplies, so "sâwm leh
  # pakhat" (11) and "zâ leh sawm hnih" (120) are Mizo while "sawm leh hnih"
  # (20) and "zâ sawm leh thum" (130) are not (#19, #34, Q-E on #27) --
  # follows from the same structure: every addend starts at a remainder. The
  # vector generator reads it from there rather than from a separate
  # declaration.
  connector: { word: "leh", placement: final_addend, min: 100 }

  rules:
    - name: units                    # bial, pakhat, … pakua
      scale: 1
      output: "{units[multiplier].standalone}"

    # 10 and 100 are said bare: "sâwm", "zâ", never "sâwm khat" (#27 rule 1).
    # The multiplier is stated rather than tested for, because the template
    # never writes it down -- a parser reading "zâ" has to be told it is one
    # hundred, and a condition can only check a value it already has (#65).
    # The circumflex stays, because a digit that follows adds to the scale
    # word rather than multiplying it.
    - name: ten                      # sâwm, sâwm pakhat, … sâwm pakua
      scale: 10
      multiplier: 1
      output: "{scales[10].standalone}[ {remainder}]"

    - name: tens                     # sawm hnih, sawm nga pariat, …
      scale: 10
      condition: "multiplier > 1"    # the digit multiplies: circumflex removed
      output: "{scales[10].multiplied} {units[multiplier].bound}[ {remainder}]"

    - name: hundred                  # zâ, zâ leh pariat, zâ sâwm leh pakhat, …
      scale: 100
      multiplier: 1
      output: "{scales[100].standalone}[ {remainder}]"

    # 200-999, confirmed by a native speaker on #27 under Q-N -- see
    # meta.sources. The hundreds digit multiplies zâ (so scales[100].multiplied,
    # circumflex dropped, #27 rule 2) exactly as the tens digit multiplies
    # sâwm, and everything after it is the 0-99 grammar unchanged, which is
    # now literally true: it is the same rules, reached through {remainder}.
    - name: hundreds                 # za hnih, za hnih leh pakhat, …
      scale: 100
      condition: "multiplier > 1"
      output: "{scales[100].multiplied} {units[multiplier].bound}[ {remainder}]"

    # 10^3-10^9 (#27). One shape at every scale, and simpler than hundreds:
    # the x1 is always said ("sâng khat", "nuai khat" -- #27 rule 1), so there
    # is no bare-word rule like `ten` or `hundred`, and the word is the same
    # multiplied or not (rule 2), so there is no circumflex to drop. The
    # multiplier is always the bound form: "sâng hnih", never "sâng pahnih"
    # (Q-L). Canonical output takes the largest scale that fits (#27, Decision
    # 2 of 2026-08-30), so below 10^10 every multiplier is one digit.
    #
    # `multiplier > 0` never matters for output, which only reaches a rule
    # with a multiplier of at least 1. It is for input: without it "sâng
    # bial" would parse as 0 x 1000.
    - name: thousands                # sâng khat, sâng hnih leh pakhat, …
      scale: 1000
      condition: "multiplier > 0"
      output: "{scales[1000].multiplied} {units[multiplier].bound}[ {remainder}]"

    - name: ten_thousands            # sîng khat, sîng khat leh zâ, …
      scale: 10000
      condition: "multiplier > 0"
      output: "{scales[10000].multiplied} {units[multiplier].bound}[ {remainder}]"

    - name: hundred_thousands        # nuai khat, …
      scale: 100000
      condition: "multiplier > 0"
      output: "{scales[100000].multiplied} {units[multiplier].bound}[ {remainder}]"

    - name: millions                 # maktaduai khat, …
      scale: 1000000
      condition: "multiplier > 0"
      output: "{scales[1000000].multiplied} {units[multiplier].bound}[ {remainder}]"

    - name: ten_millions             # vaibêlchhe hnih, vaibêlchhe khat leh pahnih, …
      scale: 10000000
      condition: "multiplier > 0"
      output: "{scales[10000000].multiplied} {units[multiplier].bound}[ {remainder}]"

    - name: hundred_millions         # vaibêlchhetak thum, …
      scale: 100000000
      condition: "multiplier > 0"
      output: "{scales[100000000].multiplied} {units[multiplier].bound}[ {remainder}]"

    - name: billions                 # tlûklehdingâwn hnih, …
      scale: 1000000000
      condition: "multiplier > 0"
      output: "{scales[1000000000].multiplied} {units[multiplier].bound}[ {remainder}]"

    # Accepted shorthand for 21-99, never produced by number_to_text: drops
    # the scale word ("sawm") and uses the bound form of both digits, e.g.
    # 23 -> "hnih thum", 66 -> "ruk ruk", 68 -> "ruk riat".
    #
    # `scope: whole` because the shorthand is a way of saying a whole number,
    # not a way of writing the end of one. Without it, recursion would let it
    # stand in as a remainder and "za hnih khat" would parse as 121 -- the
    # flat rules scoped it by their range, and a scale-keyed rule has to say
    # so instead (#65).
    - name: tens_shorthand
      scale: 10
      emit: never
      scope: whole
      condition: "multiplier > 1 and remainder > 0"
      output: "{units[multiplier].bound} {units[remainder].bound}"

parse:
  case_insensitive: true
  strip_diacritics: true   # Decision (#15): accept input typed without
                           # diacritics, since most people type on an ASCII
                           # keyboard. Applied to both sides before comparing,
                           # like case_insensitive above. number_to_text()
                           # still writes the correct diacritics.
  word_separators: ["-"]   # Decision (#46): declare only the non-whitespace
                           # separators. Unicode White_Space is a separator
                           # everywhere and the engine applies it, so listing
                           # " " here would be redundant -- and would let a
                           # target split on the declared list alone, ignore
                           # the whitespace rule, and still pass every vector,
                           # because the canonical output uses a space. Same
                           # reasoning as accepted_forms listing only the
                           # extras (#31, #38).
  # The *extra* fields a lone digit may also be spoken in, per lexicon
  # table. The units rule writes `standalone` ("pakhat" for 1), and the
  # field a rule writes is always accepted, so only the extra form is
  # listed here: "khat" parses as 1 too. Naming the table and its fields
  # keeps the decision in the spec (#31). Restricting that leniency to a
  # phrase that is a single freestanding digit stays the engine's rule --
  # it is a fact about ambiguity, not about Mizo.
  accepted_forms: { units: [bound] }
  connectors: ["leh"]      # Decision (#10): genuinely ambiguous connector; disambiguating it is out of scope by design -- see file header above.
  # Where "leh" idiomatically stands is stated by the grammar, not here: see
  # grammar.connector. The parser drops connectors wherever they fall and
  # stays deliberately more tolerant than the certified set (#12, #34).
  aliases: {}   # Decision (#15): no non-diacritic spelling variants among the
                # numerals 0-999. Confirmed by a native speaker for 0-199
                # (#15); it carries to 999 because 200-999 introduces no new
                # lexemes -- the same units and the same two scale words,
                # recombined (#27 Q-N). Diacritics are handled by
                # strip_diacritics above, and that covers every scale word
                # from 10^3 up except two.
                #
                # Those two are why this is NOT true of Mizo generally: the
                # 10^5 and 10^6 scale words take an optional trailing -h
                # (nuai/nuaih, maktaduai/maktaduaih) that strip_diacritics
                # cannot collapse. Accepted on input in any position, never
                # emitted (#27 Q-O, 2026-09-03). They are not here yet
                # because this range extension is the output side only; they
                # land with the rest of #27's input forms, and number_to_text()
                # must still emit the h-less form.


examples:
  - { number: 0,  text: "bial" }
  - { number: 1,  text: "pakhat" }
  - { number: 2,  text: "pahnih" }
  - { number: 10, text: "sâwm" }
  - { number: 11, text: "sâwm pakhat" }
  - { number: 12, text: "sâwm pahnih" }
  - { number: 20, text: "sawm hnih" }
  - { number: 21, text: "sawm hnih pakhat" }
  - { number: 22, text: "sawm hnih pahnih" }
  - { number: 30, text: "sawm thum" }
  - { number: 58, text: "sawm nga pariat" }
  - { number: 100, text: "zâ" }
  - { number: 108, text: "zâ leh pariat" }
  - { number: 110, text: "zâ leh sâwm" }
  - { number: 118, text: "zâ sâwm leh pariat" }
  - { number: 120, text: "zâ leh sawm hnih" }
  - { number: 128, text: "zâ sawm hnih leh pariat" }
  - { number: 199, text: "zâ sawm kua leh pakua" }
  # 200-999, exactly as confirmed on #27 Q-N. Independent ground truth: these
  # are written down from a native speaker, not generated from the rules, so
  # a wrong rule fails here rather than being dutifully regenerated.
  - { number: 200, text: "za hnih" }
  - { number: 201, text: "za hnih leh pakhat" }
  - { number: 210, text: "za hnih leh sâwm" }
  - { number: 211, text: "za hnih sâwm leh pakhat" }
  - { number: 250, text: "za hnih leh sawm nga" }
  - { number: 258, text: "za hnih sawm nga leh pariat" }
  # 10^3 and up, as the repo owner wrote them on #27, for the same reason.
  - { number: 1000, text: "sâng khat" }                              # rule 2
  - { number: 1990, text: "sâng khat za kua leh sawm kua" }          # Q-D
  - { number: 1991, text: "sâng khat za kua sawm kua leh pakhat" }   # Q-D
  - { number: 2000, text: "sâng hnih" }                              # rule 2
  - { number: 10000, text: "sîng khat" }                             # rule 2
  - { number: 10100, text: "sîng khat leh zâ" }                      # 2026-08-19
  - { number: 20000, text: "sîng hnih" }                             # rule 2
  - { number: 10000002, text: "vaibêlchhe khat leh pahnih" }         # Q-E
  - { number: 20000000, text: "vaibêlchhe hnih" }                    # rule 6, Q-C
  - { number: 20000050, text: "vaibêlchhe hnih leh sawm nga" }       # 2026-09-03
  - { number: 200000000, text: "vaibêlchhetak hnih" }                # Q-C
  - { number: 300000000, text: "vaibêlchhetak thum" }                # rule 6
  - { number: 2000000000, text: "tlûklehdingâwn hnih" }              # Q-C

