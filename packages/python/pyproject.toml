[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numberwords"
version = "0.1.0"
description = "Bidirectional text-number conversion driven by a single language-agnostic rule spec. Supports Mizo (Lushai) 0-100."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "instaword" }]
keywords = ["numbers", "numerals", "number-to-words", "words-to-number", "mizo", "i18n"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/instaword/numberwords"
Source = "https://github.com/instaword/numberwords"

[tool.hatch.build.targets.wheel]
packages = ["src/numberwords"]

# The sdist carries the test suite, and the suite is worth nothing without the
# conformance vectors it checks against -- they live at the repository root,
# outside this directory, so without this the sdist ships five tests that fail
# with FileNotFoundError. Downstream packagers run the suite from the sdist;
# that is the whole reason to include it.
#
# The wheel deliberately does not get them. What an installed package needs is
# the compiled spec, not the table used to verify it.
[tool.hatch.build.targets.sdist.force-include]
"../../vectors/mizo.json" = "vectors/mizo.json"
