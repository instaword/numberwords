# Root-level so it covers both reference/ and packages/python/, which live
# outside any single package's pyproject.toml.
[lint]
select = ["E", "F"]
ignore = ["E501"]  # line length is a formatting decision (#124), not a lint gate

exclude = [
  # Generated by reference/compile_spec.py, never edited by hand. CI also
  # checks that the committed file matches the compiler output byte for byte.
  "packages/python/src/numberwords/_mizo.py",
]
